name: ci

on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Nom du check exigé par les protections de branches (D02) : « build-test ».
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit des dépendances (non bloquant pour l'instant)
        # Passer continue-on-error à false une fois le socle stabilisé (ticket D09).
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (+ couverture core)
        run: npm run test:coverage

      - name: Build (core, web, functions)
        run: npm run build

      - name: Upload coverage core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: core/coverage/
          if-no-files-found: ignore
          retention-days: 14

  secrets-scan:
    # Bloquant : aucune clé / aucun token ne doit entrer dans l'historique (D08).
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
