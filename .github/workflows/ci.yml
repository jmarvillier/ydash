name: ci

on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Nom du check exigé par les protections de branches (D02) : « build-test ».
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (+ couverture core)
        run: npm run test:coverage

      - name: Build (core, web, functions)
        run: npm run build

      - name: Upload coverage core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: core/coverage/
          if-no-files-found: ignore
          retention-days: 14
