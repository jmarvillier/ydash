version: 2
updates:
  # npm : le lockfile racine couvre les 3 workspaces (core, web, functions).
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels: [devops, security]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Montées majeures volontaires (React 19, Vite 7+, ESLint 10, TS 6+…) : ticket dédié.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: ci
    labels: [devops, security]
    groups:
      actions:
        patterns: ['*']
